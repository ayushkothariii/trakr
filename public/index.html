<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>trackr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E14;--panel:#131823;--panel2:#0F141D;--line:#222A38;--line2:#2C3648;
  --text:#E7EAF1;--muted:#7C8597;--faint:#525C6E;
  --clicks:#4CC2FF;--installs:#FF8A3D;--ok:#4ADE80;--accent:#C084FC;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Inter',system-ui,sans-serif;
  --sidebar:220px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{width:var(--sidebar);flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:10}
.sidebar-logo{padding:22px 18px 18px;border-bottom:1px solid var(--line)}
.sidebar-logo .mark{width:26px;height:26px;position:relative;margin-bottom:10px}
.sidebar-logo .mark span{position:absolute;inset:0;border-radius:50%;border:2px solid var(--clicks);opacity:.35}
.sidebar-logo .mark span:nth-child(2){inset:5px;opacity:.6}
.sidebar-logo .mark span:nth-child(3){inset:10px;border-color:var(--installs);opacity:1;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.5}}
.sidebar-logo h1{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:-.01em}
.sidebar-logo .sub{font-size:11px;color:var(--faint);margin-top:2px}

.sidebar-section{padding:16px 10px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--faint)}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;margin:1px 6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);transition:all .15s;text-decoration:none}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.active{background:var(--panel2);color:var(--text);border:1px solid var(--line2)}
.nav-item .icon{font-size:15px;width:20px;text-align:center;flex:none}
.nav-item .badge{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--line2);color:var(--muted);padding:1px 6px;border-radius:8px}

/* game switcher */
.game-switcher{padding:10px 10px;border-bottom:1px solid var(--line)}
.game-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);padding:0 2px 4px}
.game-pill-group{display:flex;gap:3px;background:var(--panel2);border-radius:8px;padding:3px;border:1px solid var(--line2)}
.game-pill{flex:1;padding:6px 8px;border-radius:6px;font-size:11px;font-weight:700;background:transparent;border:0;color:var(--muted);cursor:pointer;transition:all .15s;font-family:var(--sans)}
.game-pill:hover{color:var(--text)}
.game-pill.active{background:var(--clicks);color:#040d14}

.sidebar-bottom{margin-top:auto;padding:14px 10px;border-top:1px solid var(--line)}
.sidebar-user{font-size:12px;color:var(--muted);padding:8px 12px;display:flex;align-items:center;gap:8px}
.sidebar-user .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}

/* MAIN */
.main{margin-left:var(--sidebar);flex:1;padding:30px 32px 80px;max-width:calc(100vw - var(--sidebar))}

/* gate */
.gate-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;position:fixed;inset:0;background:var(--bg);z-index:50}
.gate{max-width:360px;width:100%;text-align:center;padding:0 20px}
.gate h2{font-weight:700;font-size:20px;margin:0 0 6px;font-family:var(--mono)}
.gate p{color:var(--muted);font-size:13px;margin:0 0 20px}
.err{color:#ff7a7a;font-size:12.5px;font-family:var(--mono);margin-top:8px;min-height:16px}
.hide{display:none!important}

/* controls */
input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:13px;outline:none}
input:focus,textarea:focus{border-color:var(--clicks)}
input::placeholder{color:var(--faint)}
button{cursor:pointer;border:0;border-radius:8px;font-family:var(--sans);font-weight:600;font-size:13px;padding:10px 18px;background:var(--installs);color:#1a0f06;transition:opacity .15s}
button:hover{opacity:.85}
button:disabled{opacity:.4;cursor:default}
button.ghost{background:transparent;border:1px solid var(--line2);color:var(--muted);font-weight:500}
button.ghost:hover{color:var(--text);border-color:var(--faint)}

/* page header */
.page-header{margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.page-header h2{font-size:18px;font-weight:600}
.page-header p{font-size:13px;color:var(--muted);margin-top:2px}

/* stats bar */
.stats-bar{display:flex;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;flex:1;min-width:140px}
.stat .v{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1}
.stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:5px}
.stat.c .v{color:var(--clicks)}
.stat.i .v{color:var(--installs)}
.stat.r .v{color:var(--ok)}

/* form */
.form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:24px}
.form-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
label.fld{display:block;margin:0 0 14px}
label.fld .k{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
label.fld .k em{color:var(--faint);text-transform:none;letter-spacing:0;font-style:normal}
.actions{display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap}
.born{font-family:var(--mono);font-size:12px;color:var(--ok);opacity:0;transition:opacity .3s}
.born.show{opacity:1}

/* link rows */
.section-title{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 14px}
.rows{display:flex;flex-direction:column;gap:10px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.row .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.alias{font-family:var(--mono);font-weight:700;font-size:14px}
.lbl{color:var(--muted);font-size:13px}
.url{font-family:var(--mono);font-size:12px;color:var(--faint);margin-left:auto}
.copy{font-family:var(--mono);font-size:11px;padding:5px 9px}
.nums{display:flex;gap:26px;margin:14px 0 10px}
.num .v{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1}
.num .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:5px}
.num.c .v{color:var(--clicks)}.num.i .v{color:var(--installs)}.num.r .v{color:var(--text)}
.funnel{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden;border:1px solid var(--line2);display:flex}
.funnel .clk{height:100%;background:linear-gradient(90deg,var(--clicks),#2b6f96)}
.funnel .ins{height:100%;background:linear-gradient(90deg,var(--installs),#b85c1e)}
.meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.meta b{color:var(--text);font-weight:500}
.row .foot{display:flex;gap:10px;margin-top:14px}
.row .foot button{padding:6px 12px;font-size:12px}
.del{margin-left:auto;background:transparent;border:1px solid var(--line2);color:var(--faint)}
.del:hover{color:#ff6b6b;border-color:#5a2b2b}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:40px;border:1px dashed var(--line2);border-radius:14px}
.form-err{color:#ff7a7a;font-size:12.5px;font-family:var(--mono);margin-top:8px;min-height:16px}
</style>
</head>
<body>

<!-- GATE -->
<div class="gate-wrap" id="gate">
  <div class="gate">
    <div style="font-size:28px;margin-bottom:12px">🎯</div>
    <h2>trackr</h2>
    <p>Enter your admin token to continue.</p>
    <input id="token" type="password" placeholder="ADMIN_TOKEN" autocomplete="current-password"/>
    <div class="err" id="gateErr"></div>
    <div style="margin-top:14px"><button id="enter">Open dashboard</button></div>
  </div>
</div>

<!-- SIDEBAR -->
<nav class="sidebar hide" id="sidebar">
  <div class="sidebar-logo">
    <div class="mark"><span></span><span></span><span></span></div>
    <h1>trackr</h1>
    <div class="sub">install attribution</div>
  </div>

  <div class="game-switcher">
    <div class="game-label">Active Game</div>
    <div class="game-pill-group">
      <button class="game-pill active" data-game="tmkoc">🎓 TMKOC</button>
      <button class="game-pill" data-game="gada">🛒 Gada</button>
    </div>
  </div>

  <div class="sidebar-section">Analytics</div>
  <a class="nav-item active" href="/"><span class="icon">🔗</span> Attribution</a>
  <a class="nav-item" href="/reach.html"><span class="icon">📡</span> Social Reach</a>
  <a class="nav-item" href="/creative.html"><span class="icon">✦</span> Creative Studio</a>

  <div class="sidebar-bottom">
    <div class="sidebar-user"><span class="dot"></span><span id="origin" style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span></div>
    <button class="ghost" id="logout" style="width:calc(100% - 12px);margin:4px 6px;font-size:12px;padding:8px">Sign out</button>
  </div>
</nav>

<!-- MAIN -->
<main class="main hide" id="app">
  <div class="page-header">
    <div>
      <h2>Attribution</h2>
      <p>Track clicks and installs from your organic posts</p>
    </div>
    <div id="totalStats" style="display:flex;gap:12px"></div>
  </div>

  <div class="form">
    <div class="form-title">Create a tracked deeplink</div>
    <div class="grid2">
      <label class="fld"><span class="k">Alias <em>— your attribution tag</em></span>
        <input id="f_alias" placeholder="diwali-insta"/></label>
      <label class="fld"><span class="k">Label <em>— just for you</em></span>
        <input id="f_label" placeholder="Diwali Instagram story"/></label>
      <label class="fld"><span class="k">Android package</span>
        <input id="f_pkg" placeholder="com.yourcompany.app"/></label>
      <label class="fld"><span class="k">iOS App Store ID</span>
        <input id="f_ios" placeholder="6448311069"/></label>
      <label class="fld"><span class="k">Deep link path <em>— screen after install</em></span>
        <input id="f_deep" placeholder="/promo/diwali"/></label>
      <label class="fld"><span class="k">Desktop fallback URL</span>
        <input id="f_desk" placeholder="https://yoursite.com"/></label>
    </div>
    <div class="actions">
      <button id="create">Create link</button>
      <span class="born" id="born"></span>
    </div>
    <div class="form-err" id="formErr"></div>
  </div>

  <p class="section-title">Your links</p>
  <div class="rows" id="rows"></div>
</main>

<script>
const $=s=>document.querySelector(s);
let TOKEN=localStorage.getItem('trackr_token')||'';
let currentGame=localStorage.getItem('trackr_game')||'tmkoc';
const GAME_NAMES={tmkoc:'TMKOC Playschool',gada:'Gada Electronics'};

function applyGame(game){
  currentGame=game;
  localStorage.setItem('trackr_game',game);
  document.querySelectorAll('.game-pill').forEach(p=>p.classList.toggle('active',p.dataset.game===game));
  $('#app').querySelector('.page-header h2').textContent='Attribution';
  $('#app').querySelector('.page-header p').textContent='Tracking links for '+GAME_NAMES[game];
  load();
}
document.querySelectorAll('.game-pill').forEach(p=>{
  p.onclick=()=>{ if(p.dataset.game!==currentGame) applyGame(p.dataset.game); };
});

async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json',...(opts.headers||{})}});
  if(r.status===401)throw new Error('unauthorized');
  return r.json();
}

function showGate(msg){
  $('#app').classList.add('hide');$('#sidebar').classList.add('hide');
  $('#gate').classList.remove('hide');
  if(msg)$('#gateErr').textContent=msg;$('#token').focus();
}
function showApp(){
  $('#gate').classList.add('hide');
  $('#sidebar').classList.remove('hide');$('#app').classList.remove('hide');
  $('#origin').textContent=location.hostname;
  applyGame(currentGame);
}
$('#enter').onclick=tryToken;
$('#token').addEventListener('keydown',e=>{if(e.key==='Enter')tryToken();});
async function tryToken(){
  TOKEN=$('#token').value.trim();
  try{const r=await api('/api/whoami');if(r.ok){localStorage.setItem('trackr_token',TOKEN);showApp();}}
  catch(e){$('#gateErr').textContent='That token was rejected.';}
}
$('#logout').onclick=()=>{localStorage.removeItem('trackr_token');TOKEN='';$('#token').value='';showGate('');};

$('#create').onclick=async()=>{
  $('#formErr').textContent='';
  const body={alias:$('#f_alias').value,label:$('#f_label').value,android_package:$('#f_pkg').value,ios_appstore_id:$('#f_ios').value,deep_link_path:$('#f_deep').value,desktop_url:$('#f_desk').value,game:currentGame};
  const r=await api('/api/links',{method:'POST',body:JSON.stringify(body)});
  if(r.error){$('#formErr').textContent=r.error;return;}
  const born=$('#born');
  born.textContent=location.origin+'/l/'+r.alias+'  ✓';
  born.classList.add('show');setTimeout(()=>born.classList.remove('show'),4000);
  ['f_alias','f_label','f_pkg','f_ios','f_deep','f_desk'].forEach(id=>$('#'+id).value='');
  load();
};

function pct(i,c){return c?Math.round(i/c*100):0;}
async function load(){
  let links;
  try{links=await api('/api/links?game='+currentGame);}catch(e){return showGate('Session expired.');}
  // total stats
  const totC=links.reduce((a,l)=>a+Number(l.clicks),0);
  const totI=links.reduce((a,l)=>a+Number(l.installs),0);
  $('#totalStats').innerHTML=`
    <div class="stat c" style="min-width:100px;padding:12px 16px"><div class="v">${totC}</div><div class="l">Total clicks</div></div>
    <div class="stat i" style="min-width:100px;padding:12px 16px"><div class="v">${totI}</div><div class="l">Total installs</div></div>
    <div class="stat r" style="min-width:100px;padding:12px 16px"><div class="v">${pct(totI,totC)}%</div><div class="l">Conversion</div></div>`;
  const box=$('#rows');
  if(!links.length){box.innerHTML='<div class="empty">No links yet. Create one above and share <span style="font-family:var(--mono)">'+location.origin+'/l/&lt;alias&gt;</span> in your posts.</div>';return;}
  box.innerHTML='';
  for(const l of links){
    const url=location.origin+'/l/'+l.alias;
    const conv=pct(l.installs,l.clicks);
    const insW=l.clicks?(l.installs/l.clicks*100):0;
    const clkW=100-insW;
    const el=document.createElement('div');el.className='row';
    el.innerHTML=`
      <div class="top">
        <span class="alias">${l.alias}</span>
        ${l.label?`<span class="lbl">${esc(l.label)}</span>`:''}
        <span class="url">${url}</span>
        <button class="ghost copy" data-url="${url}">copy</button>
      </div>
      <div class="nums">
        <div class="num c"><div class="v">${l.clicks}</div><div class="l">clicks</div></div>
        <div class="num i"><div class="v">${l.installs}</div><div class="l">installs</div></div>
        <div class="num r"><div class="v">${conv}%</div><div class="l">conversion</div></div>
      </div>
      <div class="funnel"><div class="ins" style="width:${insW}%"></div><div class="clk" style="width:${clkW}%"></div></div>
      <div class="meta" id="m_${l.alias}"><span>loading…</span></div>
      <div class="foot"><button class="del" data-alias="${l.alias}">delete</button></div>`;
    box.appendChild(el);
    loadStats(l.alias);
  }
  box.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.url);b.textContent='copied';setTimeout(()=>b.textContent='copy',1500);});
  box.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{
    if(!confirm('Delete '+b.dataset.alias+'?'))return;
    await api('/api/links/'+b.dataset.alias,{method:'DELETE'});load();
  });
}
async function loadStats(alias){
  const s=await api('/api/stats/'+alias);
  const dev=s.byDevice.map(d=>`${d.device} <b>${d.n}</b>`).join('  ·  ')||'—';
  const det=s.installs.find(x=>x.match_type==='deterministic')?.n||0;
  const prob=s.installs.find(x=>x.match_type==='probabilistic')?.n||0;
  const geo=s.byCountry.slice(0,4).map(c=>`${c.country} <b>${c.n}</b>`).join('  ·  ')||'—';
  const m=document.getElementById('m_'+alias);
  if(m)m.innerHTML=`<span>devices: ${dev}</span><span>installs: <b>${det}</b> exact · <b>${prob}</b> estimated</span><span>top geo: ${geo}</span>`;
}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

if(TOKEN){api('/api/whoami').then(r=>r.ok?showApp():showGate('')).catch(()=>showGate(''));}
else showGate('');
</script>
</body>
</html>
