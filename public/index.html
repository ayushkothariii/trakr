<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>trackr — install attribution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E14; --panel:#131823; --panel2:#0F141D; --line:#222A38;
    --line2:#2C3648; --text:#E7EAF1; --muted:#7C8597; --faint:#525C6E;
    --clicks:#4CC2FF;        /* cool: a click happened */
    --installs:#FF8A3D;      /* warm: an install fired */
    --ok:#4ADE80;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
    --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--clicks)}
  .wrap{max-width:980px;margin:0 auto;padding:0 20px 80px}

  /* header */
  header{display:flex;align-items:center;gap:12px;padding:26px 0 22px;border-bottom:1px solid var(--line)}
  .mark{width:30px;height:30px;flex:none;position:relative}
  .mark span{position:absolute;inset:0;border-radius:50%;border:2px solid var(--clicks);opacity:.35}
  .mark span:nth-child(2){inset:6px;border-color:var(--clicks);opacity:.6}
  .mark span:nth-child(3){inset:12px;border-color:var(--installs);opacity:1;animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.5}}
  @media (prefers-reduced-motion:reduce){.mark span:nth-child(3){animation:none}}
  h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
  h1 b{font-family:var(--mono);font-weight:700}
  .tag{font-size:12px;color:var(--muted);margin-top:1px}
  header .right{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--faint)}
  header .right button{margin-left:10px}

  /* gate */
  .gate{max-width:380px;margin:90px auto;text-align:center}
  .gate h2{font-weight:600;font-size:18px;margin:0 0 6px}
  .gate p{color:var(--muted);font-size:13px;margin:0 0 18px}

  /* generic controls */
  label.fld{display:block;margin:0 0 12px}
  label.fld .k{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);margin-bottom:5px}
  label.fld .k em{color:var(--faint);text-transform:none;letter-spacing:0;font-style:normal}
  input{width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--text);
    border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:13px;outline:none}
  input:focus{border-color:var(--clicks)}
  input::placeholder{color:var(--faint)}
  button{cursor:pointer;border:0;border-radius:8px;font-family:var(--sans);font-weight:600;
    font-size:13px;padding:10px 16px;background:var(--installs);color:#1a0f06}
  button.ghost{background:transparent;border:1px solid var(--line2);color:var(--muted);font-weight:500}
  button.ghost:hover{color:var(--text);border-color:var(--faint)}
  button:disabled{opacity:.5;cursor:default}

  section{margin-top:30px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--faint);margin:0 0 14px}

  /* create form */
  .form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  @media(max-width:620px){.grid{grid-template-columns:1fr}}
  .form .actions{display:flex;align-items:center;gap:12px;margin-top:6px}
  .born{font-family:var(--mono);font-size:12.5px;color:var(--ok);margin-left:auto;
    opacity:0;transition:opacity .3s}
  .born.show{opacity:1}

  /* link rows */
  .rows{display:flex;flex-direction:column;gap:10px}
  .row{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .row .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .alias{font-family:var(--mono);font-weight:700;font-size:14px}
  .label{color:var(--muted);font-size:13px}
  .url{font-family:var(--mono);font-size:12px;color:var(--faint);margin-left:auto}
  .copy{font-family:var(--mono);font-size:11px;padding:5px 9px}
  .nums{display:flex;gap:26px;margin:14px 0 10px}
  .num .v{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1}
  .num .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:5px}
  .num.c .v{color:var(--clicks)} .num.i .v{color:var(--installs)}
  .num.r .v{color:var(--text)}
  /* the signature: a pipe where clicks flow in (cyan) and installs come out (amber) */
  .funnel{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden;
    border:1px solid var(--line2);display:flex}
  .funnel .clk{height:100%;background:linear-gradient(90deg,var(--clicks),#2b6f96)}
  .funnel .ins{height:100%;background:linear-gradient(90deg,var(--installs),#b85c1e)}
  .meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-family:var(--mono);
    font-size:11.5px;color:var(--muted)}
  .meta b{color:var(--text);font-weight:500}
  .row .foot{display:flex;gap:10px;margin-top:14px}
  .row .foot button{padding:6px 12px;font-size:12px}
  .del{margin-left:auto;background:transparent;border:1px solid var(--line2);color:var(--faint)}
  .del:hover{color:#ff6b6b;border-color:#5a2b2b}

  .empty{color:var(--muted);font-size:13px;text-align:center;padding:40px;
    border:1px dashed var(--line2);border-radius:14px}
  .err{color:#ff7a7a;font-size:12.5px;font-family:var(--mono);margin-top:8px;min-height:16px}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">

  <!-- TOKEN GATE -->
  <div id="gate" class="gate">
    <h2>trackr</h2>
    <p>Enter your admin token to open the dashboard.</p>
    <input id="token" type="password" placeholder="ADMIN_TOKEN" autocomplete="current-password" />
    <div class="err" id="gateErr"></div>
    <div style="margin-top:14px"><button id="enter">Open dashboard</button></div>
  </div>

  <!-- APP -->
  <div id="app" class="hide">
    <header>
      <div class="mark"><span></span><span></span><span></span></div>
      <div>
        <h1><b>trackr</b></h1>
        <div class="tag">organic install attribution · self-hosted</div>
      </div>
      <div class="right"><span id="origin"></span><a href="/creative.html" style="font-size:12px;color:var(--muted);padding:6px 12px;border-radius:8px;border:1px solid var(--line2);font-weight:500;text-decoration:none;margin-left:10px">✦ Creative Studio</a><button class="ghost" id="logout">sign out</button></div>
    </header>

    <section>
      <p class="eyebrow">Create a tracked link</p>
      <div class="form">
        <div class="grid">
          <label class="fld"><span class="k">Alias <em>— your attribution tag, e.g. diwali-insta</em></span>
            <input id="f_alias" placeholder="leave blank for a random one" /></label>
          <label class="fld"><span class="k">Label <em>— just for you</em></span>
            <input id="f_label" placeholder="Diwali Instagram story" /></label>
          <label class="fld"><span class="k">Android package</span>
            <input id="f_pkg" placeholder="com.yourcompany.app" /></label>
          <label class="fld"><span class="k">iOS App Store ID</span>
            <input id="f_ios" placeholder="6448311069" /></label>
          <label class="fld"><span class="k">Deep link path <em>— screen to open after install</em></span>
            <input id="f_deep" placeholder="/promo/diwali" /></label>
          <label class="fld"><span class="k">Desktop fallback URL</span>
            <input id="f_desk" placeholder="https://yoursite.com" /></label>
        </div>
        <div class="actions">
          <button id="create">Create link</button>
          <span class="born" id="born"></span>
        </div>
        <div class="err" id="formErr"></div>
      </div>
    </section>

    <section>
      <p class="eyebrow">Your links</p>
      <div class="rows" id="rows"></div>
    </section>
  </div>
</div>

<script>
const $ = (s)=>document.querySelector(s);
let TOKEN = localStorage.getItem('trackr_token') || '';

async function api(path, opts={}){
  const r = await fetch(path, {...opts, headers:{
    'Authorization':'Bearer '+TOKEN,
    'Content-Type':'application/json',
    ...(opts.headers||{})
  }});
  if(r.status===401){ throw new Error('unauthorized'); }
  return r.json();
}

// ---- gate ----
function showGate(msg){ $('#app').classList.add('hide'); $('#gate').classList.remove('hide');
  if(msg) $('#gateErr').textContent = msg; $('#token').focus(); }
function showApp(){ $('#gate').classList.add('hide'); $('#app').classList.remove('hide');
  $('#origin').textContent = location.origin.replace(/^https?:\/\//,''); load(); }

$('#enter').onclick = tryToken;
$('#token').addEventListener('keydown', e=>{ if(e.key==='Enter') tryToken(); });
async function tryToken(){
  TOKEN = $('#token').value.trim();
  try{ const r = await api('/api/whoami'); if(r.ok){ localStorage.setItem('trackr_token',TOKEN); showApp(); } }
  catch(e){ $('#gateErr').textContent = 'That token was rejected.'; }
}
$('#logout').onclick = ()=>{ localStorage.removeItem('trackr_token'); TOKEN=''; $('#token').value=''; showGate(''); };

// ---- create ----
$('#create').onclick = async ()=>{
  $('#formErr').textContent='';
  const body = {
    alias:$('#f_alias').value, label:$('#f_label').value,
    android_package:$('#f_pkg').value, ios_appstore_id:$('#f_ios').value,
    deep_link_path:$('#f_deep').value, desktop_url:$('#f_desk').value
  };
  const r = await api('/api/links',{method:'POST',body:JSON.stringify(body)});
  if(r.error){ $('#formErr').textContent = r.error; return; }
  const born = $('#born');
  born.textContent = location.origin+'/l/'+r.alias+'  ✓ created';
  born.classList.add('show'); setTimeout(()=>born.classList.remove('show'),4000);
  ['f_alias','f_label','f_pkg','f_ios','f_deep','f_desk'].forEach(id=>$('#'+id).value='');
  load();
};

// ---- render ----
function pct(i,c){ return c? Math.round(i/c*100):0; }
async function load(){
  let links;
  try{ links = await api('/api/links'); }catch(e){ return showGate('Session expired. Enter your token again.'); }
  const box = $('#rows');
  if(!links.length){ box.innerHTML = '<div class="empty">No links yet. Create one above, then share <span style="font-family:var(--mono)">'+location.origin+'/l/&lt;alias&gt;</span> in your posts.</div>'; return; }
  box.innerHTML='';
  for(const l of links){
    const url = location.origin+'/l/'+l.alias;
    const conv = pct(l.installs,l.clicks);
    // funnel widths: clicks fill the bar; installs overlay the converted slice
    const insW = l.clicks? (l.installs/l.clicks*100):0;
    const clkW = 100-insW;
    const el = document.createElement('div'); el.className='row';
    el.innerHTML = `
      <div class="top">
        <span class="alias">${l.alias}</span>
        ${l.label?`<span class="label">${escape(l.label)}</span>`:''}
        <span class="url">${url}</span>
        <button class="ghost copy" data-url="${url}">copy</button>
      </div>
      <div class="nums">
        <div class="num c"><div class="v">${l.clicks}</div><div class="l">clicks</div></div>
        <div class="num i"><div class="v">${l.installs}</div><div class="l">installs</div></div>
        <div class="num r"><div class="v">${conv}%</div><div class="l">conversion</div></div>
      </div>
      <div class="funnel"><div class="ins" style="width:${insW}%"></div><div class="clk" style="width:${clkW}%"></div></div>
      <div class="meta" id="m_${l.alias}"><span>loading breakdown…</span></div>
      <div class="foot">
        <button class="del" data-alias="${l.alias}">delete</button>
      </div>`;
    box.appendChild(el);
    loadStats(l.alias);
  }
  box.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{
    navigator.clipboard.writeText(b.dataset.url); b.textContent='copied'; setTimeout(()=>b.textContent='copy',1500);
  });
  box.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{
    if(!confirm('Delete '+b.dataset.alias+'? Its click & install history stays in the database.')) return;
    await api('/api/links/'+b.dataset.alias,{method:'DELETE'}); load();
  });
}
async function loadStats(alias){
  const s = await api('/api/stats/'+alias);
  const dev = s.byDevice.map(d=>`${d.device} <b>${d.n}</b>`).join('  ·  ')||'—';
  const det = s.installs.find(x=>x.match_type==='deterministic')?.n||0;
  const prob = s.installs.find(x=>x.match_type==='probabilistic')?.n||0;
  const geo = s.byCountry.slice(0,4).map(c=>`${c.country} <b>${c.n}</b>`).join('  ·  ')||'—';
  const m = document.getElementById('m_'+alias);
  if(m) m.innerHTML = `<span>devices: ${dev}</span><span>installs: <b>${det}</b> exact (android) · <b>${prob}</b> estimated (ios)</span><span>top geo: ${geo}</span>`;
}
function escape(s){ return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---- boot ----
if(TOKEN){ api('/api/whoami').then(r=>r.ok?showApp():showGate('')).catch(()=>showGate('')); }
else showGate('');
</script>
</body>
</html>
